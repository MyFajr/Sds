name: Extract ESDS source archive

on:
  push:
    branches:
      - work/esds-source-extract
    paths:
      - .github/workflows/extract-source.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/esds-source-extract
          persist-credentials: true
      - name: Extract plugin archive
        run: |
          mkdir -p source
          unzip -q ESDS_0.9.19_Preview_Scroll_Fix.zip -d source
          find source -maxdepth 4 -type f -print
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source
          if git diff --cached --quiet; then
            echo "No extracted source changes."
          else
            git commit -m "Extract ESDS 0.9.19 source for maintenance"
            git push
          fi
